[project]
name = "gha-ci-notebook-checks"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4==4.15.0",
    "click>=8.4.2,<8.5",
    "lxml==6.1.1",
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "pynblint==0.1.6",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "ruff==0.16.1",
]

[tool.ruff]
target-version = "py310"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
