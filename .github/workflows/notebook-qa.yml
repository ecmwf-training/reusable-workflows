name: Notebook QA

on:
  workflow_call:
    inputs:
      notebooks:
        description: "Space-separated list of notebook paths to check (default: all *.ipynb)"
        required: false
        type: string
        default: ""
      execution_runner:
        description: "Runner for notebook execution (supports self-hosted)"
        required: false
        type: string
        default: "ubuntu-latest"
      execution_timeout:
        description: "Timeout in minutes for notebook execution job"
        required: false
        type: number
        default: 60
      qa_tools_repo:
        description: "Repository containing QA tools"
        required: false
        type: string
        default: "ecmwf-training/reusable-workflows"
      jira_create_ticket:
        description: "Create Jira ticket on failure (requires JIRA_* secrets)"
        required: false
        type: boolean
        default: false
      jira_issue_type:
        description: "Jira issue type for failure tickets"
        required: false
        type: string
        default: "Bug"
      jira_labels:
        description: "Comma-separated labels for Jira ticket"
        required: false
        type: string
        default: "notebook-qa,automated"
      pr_comment_summary:
        description: "Post the automated review summary as a pull request comment"
        required: false
        type: boolean
        default: true
    secrets:
      JIRA_BASE_URL:
        required: false
      JIRA_USER_EMAIL:
        required: false
      JIRA_API_TOKEN:
        required: false
      JIRA_PROJECT_KEY:
        required: false
      CDSAPI_KEY:
        required: false

env:
  QA_OUTPUT_DIR: qa_outputs${{ github.run_id }}

jobs:
  # Job 0: Collect notebooks to check (shared by all jobs)
  collect:
    runs-on: ubuntu-latest
    outputs:
      notebooks: ${{ steps.notebooks.outputs.files }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Fetch PR base for diff
        if: github.event.pull_request.base.sha != ''
        run: git fetch --depth=1 origin "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

      - name: Get notebooks
        id: notebooks
        env:
          INPUT_NOTEBOOKS: ${{ inputs.notebooks }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$INPUT_NOTEBOOKS" ]; then
            NBS=$(printf '%s\n' $INPUT_NOTEBOOKS)
          elif [ -n "$BASE_SHA" ]; then
            NBS=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD -- '*.ipynb' \
              | grep -v '\.ipynb_checkpoints/' \
              | sed 's|^|./|' || true)
          else
            NBS=$(find . -name '*.ipynb' -not -path '*/.ipynb_checkpoints/*')
          fi
          if [ -z "$NBS" ]; then
            echo "files=" >> "$GITHUB_OUTPUT"
            echo "No notebooks found."
          else
            {
              echo "files<<__NB_EOF__"
              echo "$NBS"
              echo "__NB_EOF__"
            } >> "$GITHUB_OUTPUT"
            echo "Notebooks:"
            echo "$NBS"
          fi

  # Job 1: Static checks (fast, run on default runner)
  lint:
    needs: collect
    runs-on: ubuntu-latest
    outputs:
      linter_result: ${{ steps.linter.outcome }}
      formatter_result: ${{ steps.formatter.outcome }}
      pynblint_result: ${{ steps.pynblint.outcome }}
      link_result: ${{ steps.link_checker.outcome }}
      figure_result: ${{ steps.figure_checker.outcome }}
      metadata_result: ${{ steps.metadata_checker.outcome }}
      data_source_result: ${{ steps.data_source_checker.outcome }}
      accessibility_result: ${{ steps.accessibility_checker.outcome }}
      license_result: ${{ steps.license.outcome }}
      changelog_result: ${{ steps.changelog.outcome }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Checkout QA tools
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ inputs.qa_tools_repo }}
          path: .tmp/${{ github.run_id }}-qa-tools
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0

      - name: Install QA tools
        working-directory: .tmp/${{ github.run_id }}-qa-tools
        run: |
          uv sync --frozen --no-install-project
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      # Load QA configuration
      - name: Load QA config
        id: config
        env:
          ALL_NOTEBOOKS: ${{ needs.collect.outputs.notebooks }}
        run: |
          python .tmp/${{ github.run_id }}-qa-tools/process-notebooks/checkers/write_gha_config.py \
            --checks linter formatter pynblint links figures metadata data_source accessibility license changelog \
            --config .github/notebook-qa.yml \
            --extras

      # Linting checks
      - name: (2.2.3) Run linter
        id: linter
        if: (success() || failure()) && steps.config.outputs.skip_linter != 'true' && steps.config.outputs.notebooks_linter != ''
        env:
          NOTEBOOKS: ${{ steps.config.outputs.notebooks_linter }}
        run: |
          mapfile -t nbs <<< "$NOTEBOOKS"
          ruff check "${nbs[@]}"

      - name: (2.2.3) Run formatter
        id: formatter
        if: (success() || failure()) && steps.config.outputs.skip_formatter != 'true' && steps.config.outputs.notebooks_formatter != ''
        env:
          NOTEBOOKS: ${{ steps.config.outputs.notebooks_formatter }}
        run: |
          mapfile -t nbs <<< "$NOTEBOOKS"
          ruff format --check --diff "${nbs[@]}"

      - name: (2.2.3) Run pynblint
        id: pynblint
        if: (success() || failure()) && steps.config.outputs.skip_pynblint != 'true' && steps.config.outputs.notebooks_pynblint != ''
        env:
          NOTEBOOKS: ${{ steps.config.outputs.notebooks_pynblint }}
          PYNBLINT_EXCLUDE: ${{ steps.config.outputs.pynblint_exclude }}
        run: |
          mapfile -t nbs <<< "$NOTEBOOKS"
          failed=0
          for nb in "${nbs[@]}"; do
            echo "Checking: $nb"
            output_file="/tmp/pynblint_$(basename "$nb" .ipynb).json"
            if [ -n "$PYNBLINT_EXCLUDE" ]; then
              pynblint "$nb" -o "$output_file" --exclude "$PYNBLINT_EXCLUDE"
            else
              pynblint "$nb" -o "$output_file"
            fi

            # Parse JSON to check for lints (pynblint always exits 0)
            lint_count=$(python -c "import json; print(len(json.load(open('$output_file'))['lints']))")
            if [ "$lint_count" -gt 0 ]; then
              echo "❌ $nb has $lint_count pynblint issue(s):"
              python -c "
          import json
          data = json.load(open('$output_file'))
          for lint in data['lints']:
              print(f\"  - ({lint['slug']}) {lint['description']}\")
          "
              failed=1
            else
              echo "✅ $nb passed pynblint"
            fi
          done
          exit $failed

      # Link checking with lychee (fast, Rust-based)
      - name: (1.2.3) Check links
        id: link_checker
        if: (success() || failure()) && steps.config.outputs.skip_links != 'true' && steps.config.outputs.notebooks_links != ''
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          args: --verbose --no-progress ${{ steps.config.outputs.notebooks_links }}
          fail: true

      # Custom checks
      - name: (3.3.2) Check figure labels and sources
        id: figure_checker
        if: (success() || failure()) && steps.config.outputs.skip_figures != 'true' && steps.config.outputs.notebooks_figures != ''
        env:
          NOTEBOOKS: ${{ steps.config.outputs.notebooks_figures }}
        run: |
          mapfile -t nbs <<< "$NOTEBOOKS"
          python .tmp/${{ github.run_id }}-qa-tools/process-notebooks/checkers/figure_checker.py \
            --config .github/notebook-qa.yml \
            "${nbs[@]}"

      # Metadata version check
      - name: (1.2.6) Check version metadata
        id: metadata_checker
        if: (success() || failure()) && steps.config.outputs.skip_metadata != 'true' && steps.config.outputs.notebooks_metadata != ''
        env:
          NOTEBOOKS: ${{ steps.config.outputs.notebooks_metadata }}
        run: |
          mapfile -t nbs <<< "$NOTEBOOKS"
          python .tmp/${{ github.run_id }}-qa-tools/process-notebooks/checkers/metadata_checker.py \
            --config .github/notebook-qa.yml \
            "${nbs[@]}"

      # Data source check (warning only, criterion 1.2.8)
      - name: (1.2.8) Check data sources
        id: data_source_checker
        if: (success() || failure()) && steps.config.outputs.skip_data_source != 'true' && steps.config.outputs.notebooks_data_source != ''
        env:
          NOTEBOOKS: ${{ steps.config.outputs.notebooks_data_source }}
        run: |
          mapfile -t nbs <<< "$NOTEBOOKS"
          python .tmp/${{ github.run_id }}-qa-tools/process-notebooks/checkers/data_source_checker.py \
            --config .github/notebook-qa.yml \
            "${nbs[@]}"

      # Accessibility check
      - name: (3.1.3) Check accessibility
        id: accessibility_checker
        if: (success() || failure()) && steps.config.outputs.skip_accessibility != 'true' && steps.config.outputs.notebooks_accessibility != ''
        uses: berkeley-dsep-infra/jupyterlab-a11y-checker@c77482165508460d671cdad6ecdff5ac72ab6063
        with:
          files: ${{ steps.config.outputs.notebooks_accessibility }}

      # File existence checks
      - name: (1.2.4) Check LICENSE
        id: license
        if: (success() || failure()) && steps.config.outputs.skip_license != 'true'
        run: |
          if [ -s LICENSE ]; then
            echo "✅ LICENSE file is present and non-empty"
          else
            echo "❌ LICENSE file is missing or empty"
            exit 1
          fi

      - name: (4.2.3) Check CHANGELOG
        id: changelog
        if: (success() || failure()) && steps.config.outputs.skip_changelog != 'true'
        run: |
          if [ -s CHANGELOG.md ]; then
            echo "✅ CHANGELOG.md file is present and non-empty"
          else
            echo "❌ CHANGELOG.md file is missing or empty"
            exit 1
          fi

  # Job 2: Notebook execution (resource-intensive, configurable runner)
  execute:
    needs: collect
    runs-on: ${{ inputs.execution_runner }}
    timeout-minutes: ${{ inputs.execution_timeout }}
    outputs:
      execute_result: ${{ steps.execute_notebooks.outcome }}
    defaults:
      run:
        shell: bash -el {0}
    env:
      CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }} # zizmor: ignore[secrets-outside-env]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Checkout QA tools
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ inputs.qa_tools_repo }}
          path: .tmp/${{ github.run_id }}-qa-tools
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0

      - name: Install QA tools
        working-directory: .tmp/${{ github.run_id }}-qa-tools
        run: uv sync --frozen --no-install-project

      # Load QA config to check if execute is disabled and to validate performance thresholds
      - name: Load QA config
        id: config
        env:
          ALL_NOTEBOOKS: ${{ needs.collect.outputs.notebooks }}
        run: |
          .tmp/${{ github.run_id }}-qa-tools/.venv/bin/python \
            .tmp/${{ github.run_id }}-qa-tools/process-notebooks/checkers/write_gha_config.py \
            --checks execute \
            --config .github/notebook-qa.yml \
            --performance-tests

      - name: Skip execution check
        if: steps.config.outputs.skip_execute == 'true' || steps.config.outputs.notebooks_execute == ''
        run: echo "Notebook execution skipped by configuration"

      - name: Set up Conda
        if: steps.config.outputs.skip_execute != 'true' && steps.config.outputs.notebooks_execute != ''
        uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3.3.0
        with:
          miniforge-version: latest
          activate-environment: notebook-qa
          environment-file: environment.yml
          use-mamba: true

      - name: Install execution tools
        if: steps.config.outputs.skip_execute != 'true' && steps.config.outputs.notebooks_execute != ''
        run: pip install ploomber-engine psutil matplotlib

      - name: Configure CDS API
        if: steps.config.outputs.skip_execute != 'true' && steps.config.outputs.notebooks_execute != '' && env.CDSAPI_KEY != ''
        run: |
          echo "url: https://cds.climate.copernicus.eu/api" > ~/.cdsapirc
          echo "key: $CDSAPI_KEY" >> ~/.cdsapirc

      - name: (2.2.1, 2.2.4, 2.2.6, 2.3.1, 2.3.2) Execute notebooks and check performance
        id: execute_notebooks
        if: steps.config.outputs.skip_execute != 'true' && steps.config.outputs.notebooks_execute != ''
        env:
          NOTEBOOKS_EXECUTE: ${{ steps.config.outputs.notebooks_execute }}
          MAX_CELL_MEMORY_MB_WARNING: ${{ steps.config.outputs.max_cell_memory_mb_warning }}
          MAX_CELL_MEMORY_MB_FAIL: ${{ steps.config.outputs.max_cell_memory_mb_fail }}
          MAX_CELL_RUNTIME_SECONDS_WARNING: ${{ steps.config.outputs.max_cell_runtime_seconds_warning }}
          MAX_CELL_RUNTIME_SECONDS_FAIL: ${{ steps.config.outputs.max_cell_runtime_seconds_fail }}
        run: |
          mapfile -t nbs <<< "$NOTEBOOKS_EXECUTE"
          python .tmp/${{ github.run_id }}-qa-tools/process-notebooks/checkers/execute_notebooks.py \
            --output-dir "$QA_OUTPUT_DIR" \
            "${nbs[@]}"

      - name: Upload performance artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: notebook-performance-${{ github.run_id }}
          path: ${{ env.QA_OUTPUT_DIR }}
          if-no-files-found: ignore

  # Job 3: Write workflow status summary
  summary:
    needs: [collect, lint, execute]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Write automated review summary
        id: review_summary
        env:
          LINT_JOB_RESULT: ${{ needs.lint.result }}
          EXECUTE_JOB_RESULT: ${{ needs.execute.result }}
          LINK_RESULT: ${{ needs.lint.outputs.link_result }}
          LICENSE_RESULT: ${{ needs.lint.outputs.license_result }}
          METADATA_RESULT: ${{ needs.lint.outputs.metadata_result }}
          DATA_SOURCE_RESULT: ${{ needs.lint.outputs.data_source_result }}
          LINTER_RESULT: ${{ needs.lint.outputs.linter_result }}
          FORMATTER_RESULT: ${{ needs.lint.outputs.formatter_result }}
          PYNBLINT_RESULT: ${{ needs.lint.outputs.pynblint_result }}
          TEST_RESULT: ${{ needs.lint.outputs.test_result }}
          FIGURE_RESULT: ${{ needs.lint.outputs.figure_result }}
          ACCESSIBILITY_RESULT: ${{ needs.lint.outputs.accessibility_result }}
          CHANGELOG_RESULT: ${{ needs.lint.outputs.changelog_result }}
          EXECUTE_RESULT: ${{ needs.execute.outputs.execute_result }}
        run: |
          summary_file="${RUNNER_TEMP:-/tmp}/notebook-qa-summary.md"

          format_status() {
            case "$1" in
              success) echo "Pass" ;;
              failure) echo "Fail" ;;
              cancelled) echo "Cancelled" ;;
              skipped) echo "Skipped" ;;
              *) echo "N/A" ;;
            esac
          }

          check_status() {
            step_result="$1"
            job_result="$2"

            if [ -z "$step_result" ] && [ "$job_result" != "success" ]; then
              step_result="$job_result"
            fi

            format_status "$step_result"
          }

          aggregate_status() {
            has_success=false
            has_skipped=false
            has_cancelled=false

            for result in "$@"; do
              case "$result" in
                failure)
                  echo "Fail"
                  return
                  ;;
                cancelled)
                  has_cancelled=true
                  ;;
                success)
                  has_success=true
                  ;;
                skipped)
                  has_skipped=true
                  ;;
              esac
            done

            if [ "$has_cancelled" = "true" ]; then
              echo "Cancelled"
            elif [ "$has_success" = "true" ]; then
              echo "Pass"
            elif [ "$has_skipped" = "true" ]; then
              echo "Skipped"
            elif [ "$LINT_JOB_RESULT" != "success" ]; then
              format_status "$LINT_JOB_RESULT"
            else
              echo "N/A"
            fi
          }

          append_row() {
            printf '| %s | %s | %s | %s | %s | %s | %s |\n' "$@" >> "$summary_file"
          }

          links_status=$(check_status "$LINK_RESULT" "$LINT_JOB_RESULT")
          license_status=$(check_status "$LICENSE_RESULT" "$LINT_JOB_RESULT")
          metadata_status=$(check_status "$METADATA_RESULT" "$LINT_JOB_RESULT")
          data_source_status=$(check_status "$DATA_SOURCE_RESULT" "$LINT_JOB_RESULT")
          execute_status=$(check_status "$EXECUTE_RESULT" "$EXECUTE_JOB_RESULT")
          code_style_status=$(aggregate_status "$LINTER_RESULT" "$FORMATTER_RESULT" "$PYNBLINT_RESULT")
          tests_status=$(check_status "$TEST_RESULT" "$LINT_JOB_RESULT")
          figure_status=$(check_status "$FIGURE_RESULT" "$LINT_JOB_RESULT")
          accessibility_status=$(check_status "$ACCESSIBILITY_RESULT" "$LINT_JOB_RESULT")
          changelog_status=$(check_status "$CHANGELOG_RESULT" "$LINT_JOB_RESULT")

          {
            echo "## AUTOMATED REVIEW"
            echo
            echo "| Category | Requirement | Criterion | Ref no.<br>(to be deleted) | Automated Result<br>(to be copied from GH Actions) | Final Verdict from QTO | Note from QTO (if any)<br>e.g., details why final verdict is different: overwritten / not necessary / fail is acceptable |"
            echo "| --- | --- | --- | --- | --- | --- | --- |"
          } > "$summary_file"

          append_row "1. Learning Resource Management" "Reliable access<br>Access to the learning resource and all corresponding information must be open, free, and reliable." "All links in the learning resource must work." "1.2.3" "$links_status" "" ""
          append_row "1. Learning Resource Management" "Reliable access<br>Access to the learning resource and all corresponding information must be open, free, and reliable." "All licences applicable to the learning resource must be provided." "1.2.4" "$license_status" "" ""
          append_row "1. Learning Resource Management" "Reliable access<br>Access to the learning resource and all corresponding information must be open, free, and reliable." "The date of the most recent version of the learning resource must be stated." "1.2.6" "$metadata_status" "" ""
          append_row "1. Learning Resource Management" "Reliable access<br>Access to the learning resource and all corresponding information must be open, free, and reliable." "The date of the most recent execution of the learning resource code must be stated." "1.2.7" "N/A" "" ""
          append_row "1. Learning Resource Management" "Reliable access<br>Access to the learning resource and all corresponding information must be open, free, and reliable." "All datasets used in the learning resource must be available." "1.2.8" "$data_source_status" "" ""
          append_row "2. Technical Quality" "Code Functionality<br>The code must function as intended, comply with relevant standards, and be user friendly." "All code cells must be able to run sequentially without errors." "2.2.1" "$execute_status" "" ""
          append_row "2. Technical Quality" "Code Functionality<br>The code must function as intended, comply with relevant standards, and be user friendly." "All Python code must adhere to the Black style." "2.2.3" "$code_style_status" "" ""
          append_row "2. Technical Quality" "Code Functionality<br>The code must function as intended, comply with relevant standards, and be user friendly." "All installation/execute instructions must be functional across current devices and operating systems." "2.2.4" "$execute_status" "" ""
          append_row "2. Technical Quality" "Code Functionality<br>The code must function as intended, comply with relevant standards, and be user friendly." "All installation/execute instructions must be functional across current internet browsers." "2.2.5" "N/A" "" ""
          append_row "2. Technical Quality" "Code Functionality<br>The code must function as intended, comply with relevant standards, and be user friendly." "The learning resource must be functional using the supplied dependencies and/or environment." "2.3.1" "$execute_status" "" ""
          append_row "2. Technical Quality" "Code Functionality<br>The code must function as intended, comply with relevant standards, and be user friendly." "All dependencies of the source code must be stable and reliable." "2.2.8" "N/A" "" ""
          append_row "2. Technical Quality" "Code Functionality<br>The code must function as intended, comply with relevant standards, and be user friendly." "All dependencies of the source code must be regularly security checked." "2.2.7" "N/A" "" ""
          append_row "2. Technical Quality" "Performance<br>The learning resource must be responsive." "The learning resource must come with a set of tests for evaluating its performance." "2.3.1" "$tests_status" "" ""
          append_row "2. Technical Quality" "Performance<br>The learning resource must be responsive." "Performance tests must pass with X% coverage." "2.3.2" "$tests_status" "" ""
          append_row "3. User Experience" "Accessibility<br>The learning resource must comply with accessibility standards." "Key text-based information must be compatible with text to audio software." "3.1.3" "$accessibility_status" "" ""
          append_row "3. User Experience" "Interpretation<br>The learning resource must maintain scientific integrity." "Graphs and figures must be properly labelled and include source information." "3.3.2" "$figure_status" "" ""
          append_row "4. Documentation" "Scientific Basis and Value<br>Documentation on the scientific basis and value of the learning resource must be available." "Underlying sources, datasets, and publications must be referenced." "4.1.1" "N/A" "" ""
          append_row "4. Documentation" "Scientific Basis and Value<br>Documentation on the scientific basis and value of the learning resource must be available." "All figures, tables, and datasets must be accompanied by appropriate attribution and explanations." "4.1.2" "N/A" "" ""
          append_row "4. Documentation" "Quality Control<br>Quality control and validation activities must be fully documented." "A record of all revisions and updates must be available in the documentation." "4.2.3" "$changelog_status" "" ""
          append_row "5. Fitness for Purpose and Scientific Soundness" "In expert reviews only" "N/A" "N/A" "N/A" "N/A" "N/A"

          cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"
          echo "summary_file=$summary_file" >> "$GITHUB_OUTPUT"

      - name: Post automated review summary comment
        if: >-
          always() &&
          inputs.pr_comment_summary == true &&
          github.event.pull_request.number != '' &&
          steps.review_summary.outputs.summary_file != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SUMMARY_FILE: ${{ steps.review_summary.outputs.summary_file }}
        run: |
          comment_marker="<!-- notebook-qa-summary-comment -->"
          comments_url="repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments"
          comment_file="${RUNNER_TEMP:-/tmp}/notebook-qa-summary-comment.md"
          payload_file="${RUNNER_TEMP:-/tmp}/notebook-qa-comment-payload.json"

          {
            echo "$comment_marker"
            echo
            cat "$SUMMARY_FILE"
            echo
            echo "_Updated by [workflow run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})._"
          } > "$comment_file"

          set -o pipefail
          if ! existing_comment_id=$(gh api "$comments_url" \
            --paginate \
            --jq '.[] | select((.body // "") | contains("<!-- notebook-qa-summary-comment -->")) | .id' \
            | sed -n '1p'); then
            echo "::warning::Unable to list pull request comments. Grant pull-requests: write to the reusable workflow caller to enable QA summary comments."
            exit 0
          fi

          python3 - "$comment_file" "$payload_file" << 'EOF'
          import json
          import sys

          comment_path, payload_path = sys.argv[1], sys.argv[2]
          with open(comment_path, encoding="utf-8") as comment_file:
              body = comment_file.read()

          with open(payload_path, "w", encoding="utf-8") as payload_file:
              json.dump({"body": body}, payload_file)
          EOF

          if [ -n "$existing_comment_id" ]; then
            if gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing_comment_id}" --input "$payload_file" > /dev/null; then
              echo "Updated pull request QA summary comment."
            else
              echo "::warning::Unable to update pull request QA summary comment."
            fi
          elif gh api --method POST "$comments_url" --input "$payload_file" > /dev/null; then
            echo "Created pull request QA summary comment."
          else
            echo "::warning::Unable to create pull request QA summary comment."
          fi

  # Job 4: Create Jira ticket on failure (optional)
  notify-failure:
    needs: [lint, execute]
    runs-on: ubuntu-latest
    if: >-
      always() &&
      inputs.jira_create_ticket == true &&
      (needs.lint.result == 'failure' || needs.execute.result == 'failure')
    steps:
      - name: Login to Jira
        uses: atlassian/gajira-login@ca13f8850ea309cf44a6e4e0c49d9aa48ac3ca4c # v3
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }} # zizmor: ignore[secrets-outside-env]
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }} # zizmor: ignore[secrets-outside-env]
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }} # zizmor: ignore[secrets-outside-env]

      - name: Build failure summary
        id: summary
        env:
          LINT_LINTER: ${{ needs.lint.outputs.linter_result }}
          LINT_FORMATTER: ${{ needs.lint.outputs.formatter_result }}
          LINT_PYNBLINT: ${{ needs.lint.outputs.pynblint_result }}
          LINT_LINKS: ${{ needs.lint.outputs.link_result }}
          LINT_FIGURES: ${{ needs.lint.outputs.figure_result }}
          LINT_METADATA: ${{ needs.lint.outputs.metadata_result }}
          LINT_A11Y: ${{ needs.lint.outputs.accessibility_result }}
          LINT_LICENSE: ${{ needs.lint.outputs.license_result }}
          LINT_CHANGELOG: ${{ needs.lint.outputs.changelog_result }}
          EXEC_RESULT: ${{ needs.execute.outputs.execute_result }}
          JIRA_LABELS_INPUT: ${{ inputs.jira_labels }}
        run: |
          # Build a list of failed checks
          FAILED_CHECKS=""

          # Lint job checks
          [ "$LINT_LINTER" = "failure" ] && FAILED_CHECKS="${FAILED_CHECKS}- Linter (ruff check)\n"
          [ "$LINT_FORMATTER" = "failure" ] && FAILED_CHECKS="${FAILED_CHECKS}- Formatter (ruff format)\n"
          [ "$LINT_PYNBLINT" = "failure" ] && FAILED_CHECKS="${FAILED_CHECKS}- Pynblint\n"
          [ "$LINT_LINKS" = "failure" ] && FAILED_CHECKS="${FAILED_CHECKS}- Link checker\n"
          [ "$LINT_FIGURES" = "failure" ] && FAILED_CHECKS="${FAILED_CHECKS}- Figure labels/sources\n"
          [ "$LINT_METADATA" = "failure" ] && FAILED_CHECKS="${FAILED_CHECKS}- Version metadata\n"
          [ "$LINT_A11Y" = "failure" ] && FAILED_CHECKS="${FAILED_CHECKS}- Accessibility\n"
          [ "$LINT_LICENSE" = "failure" ] && FAILED_CHECKS="${FAILED_CHECKS}- LICENSE file\n"
          [ "$LINT_CHANGELOG" = "failure" ] && FAILED_CHECKS="${FAILED_CHECKS}- CHANGELOG\n"

          # Execute job
          [ "$EXEC_RESULT" = "failure" ] && FAILED_CHECKS="${FAILED_CHECKS}- Notebook execution/performance tests\n"

          echo "failed_checks<<EOF" >> $GITHUB_OUTPUT
          echo -e "$FAILED_CHECKS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Convert comma-separated labels to JSON array
          LABELS_JSON=$(echo "$JIRA_LABELS_INPUT" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | jq -R . | jq -s .)
          echo "labels_json=$LABELS_JSON" >> $GITHUB_OUTPUT

      - name: Create Jira ticket
        uses: atlassian/gajira-create@1ff0b6bd115a780592b47bfbb63fc4629132e6ec # v3
        with:
          project: ${{ secrets.JIRA_PROJECT_KEY }} # zizmor: ignore[secrets-outside-env]
          issuetype: ${{ inputs.jira_issue_type }}
          summary: "[Notebook QA] Checks failed in ${{ github.repository }} (${{ github.ref_name }})"
          description: |
            h2. Notebook QA Workflow Failure

            *Repository:* ${{ github.repository }}
            *Branch:* ${{ github.ref_name }}
            *Commit:* ${{ github.sha }}
            *Workflow Run:* [View logs|${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}]

            h3. Failed Checks
            ${{ steps.summary.outputs.failed_checks }}

            h3. Triggered By
            ${{ github.event.head_commit.message || github.event.pull_request.title || 'Manual run' }}
          fields: '{"labels": ${{ steps.summary.outputs.labels_json }}}'
